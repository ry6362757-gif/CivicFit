<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicFit - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-city"></i> Civic<span>Fit</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="complaint.html">File Complaint</a>
                <a href="track.html">Track</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <h2><i class="fas fa-chart-line"></i> Complaint Analytics Dashboard</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-ticket-alt"></i>
                <h3 id="totalComplaints">0</h3>
                <p>Total Complaints</p>
            </div>
            <div class="stat-card pending">
                <i class="fas fa-clock"></i>
                <h3 id="pendingCount">0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-card progress">
                <i class="fas fa-spinner"></i>
                <h3 id="progressCount">0</h3>
                <p>In Progress</p>
            </div>
            <div class="stat-card resolved">
                <i class="fas fa-check-circle"></i>
                <h3 id="resolvedCount">0</h3>
                <p>Resolved</p>
            </div>
        </div>
        <div class="charts-row">
            <div class="chart-box">
                <canvas id="statusChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="cityChart"></canvas>
            </div>
        </div>
        <div class="chart-box full-width">
            <canvas id="categoryChart"></canvas>
        </div>
    </div>
    <footer><p>Live data from your complaints</p></footer>
    <script src="script.js"></script>
</body>
</html>
