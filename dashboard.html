<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicFit - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="navbar">
        <div class="logo">Civic<span>Fit</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="complaint.html">File Complaint</a>
            <a href="track.html">Track</a>
            <a href="dashboard.html" class="active">Dashboard</a>
        </div>
    </div>
    <div class="container">
        <h2><i class="fas fa-chart-line"></i> Analytics Dashboard</h2>
        <div class="dashboard-grid">
            <div class="stat-card">
                <i class="fas fa-ticket-alt"></i>
                <h3 id="totalCount">0</h3>
                <p>Total Complaints</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <h3 id="pendingCount">0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-spinner"></i>
                <h3 id="progressCount">0</h3>
                <p>In Progress</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle"></i>
                <h3 id="resolvedCount">0</h3>
                <p>Resolved</p>
            </div>
        </div>
        <div class="chart-card">
            <h3><i class="fas fa-chart-pie"></i> Complaint Status</h3>
            <canvas id="statusChart"></canvas>
        </div>
        <div class="chart-card">
            <h3><i class="fas fa-city"></i> Complaints per City</h3>
            <canvas id="cityChart"></canvas>
        </div>
        <div class="chart-card">
            <h3><i class="fas fa-tags"></i> Complaints by Category</h3>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>
    <script>
        function loadData() {
            return JSON.parse(localStorage.getItem('civicfit') || '[]');
        }

        let statusChart, cityChart, categoryChart;

        function updateDashboard() {
            const complaints = loadData();
            const total = complaints.length;
            const pending = complaints.filter(c => c.status === 'Pending').length;
            const inProgress = complaints.filter(c => c.status === 'In Progress').length;
            const resolved = complaints.filter(c => c.status === 'Resolved').length;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('progressCount').innerText = inProgress;
            document.getElementById('resolvedCount').innerText = resolved;

            // Status chart (Doughnut)
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            if (statusChart) statusChart.destroy();
            statusChart = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Pending', 'In Progress', 'Resolved'],
                    datasets: [{
                        data: [pending, inProgress, resolved],
                        backgroundColor: ['#ff9800', '#17a2b8', '#28a745']
                    }]
                }
            });

            // City chart (Bar)
            const cityMap = {};
            complaints.forEach(c => { cityMap[c.city] = (cityMap[c.city] || 0) + 1; });
            const cityLabels = Object.keys(cityMap);
            const cityValues = Object.values(cityMap);
            const cityCtx = document.getElementById('cityChart').getContext('2d');
            if (cityChart) cityChart.destroy();
            cityChart = new Chart(cityCtx, {
                type: 'bar',
                data: {
                    labels: cityLabels,
                    datasets: [{
                        label: 'Number of Complaints',
                        data: cityValues,
                        backgroundColor: '#2c3e66'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            // Category chart (Pie)
            const catMap = {};
            complaints.forEach(c => { catMap[c.category] = (catMap[c.category] || 0) + 1; });
            const catLabels = Object.keys(catMap);
            const catValues = Object.values(catMap);
            const catCtx = document.getElementById('categoryChart').getContext('2d');
            if (categoryChart) categoryChart.destroy();
            categoryChart = new Chart(catCtx, {
                type: 'pie',
                data: {
                    labels: catLabels,
                    datasets: [{
                        data: catValues,
                        backgroundColor: ['#e63946', '#2c3e66', '#ffb347', '#28a745', '#17a2b8', '#6c757d', '#fd7e14']
                    }]
                }
            });
        }

        updateDashboard();
        window.addEventListener('storage', () => updateDashboard());
    </script>
</body>
</html>
