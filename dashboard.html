<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard - CivicFit</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="logo"><div class="logo-icon"><i class="fas fa-city"></i><span class="logo-text">Civic<span class="logo-highlight">Fit</span></span></div></div>
            <div class="nav-links" id="navLinks">
                <a href="index.html"><i class="fas fa-home"></i> <span data-i18n="nav_home">Home</span></a>
                <a href="complaint.html"><i class="fas fa-pen-alt"></i> <span data-i18n="nav_complaint">File Complaint</span></a>
                <a href="track.html"><i class="fas fa-search-location"></i> <span data-i18n="nav_track">Track</span></a>
                <a href="dashboard.html" class="active"><i class="fas fa-chart-line"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
            </div>
            <div class="lang-switcher">
                <select id="languageSelect">
                    <option value="en">🇬🇧 English</option>
                    <option value="hi">🇮🇳 हिन्दी</option>
                    <option value="mr">🇮🇳 मराठी</option>
                </select>
            </div>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="dashboard-page">
        <div class="dashboard-container">
            <div class="dashboard-header"><h1><i class="fas fa-tachometer-alt"></i> <span data-i18n="dash_title">Live Civic Dashboard</span></h1></div>
            <div class="stats-cards">
                <div class="stats-card primary"><i class="fas fa-clipboard-list"></i><div><span class="stats-value" id="dashTotal">0</span><span class="stats-label" data-i18n="dash_total">Total</span></div></div>
                <div class="stats-card success"><i class="fas fa-check-circle"></i><div><span class="stats-value" id="dashResolved">0</span><span class="stats-label" data-i18n="dash_resolved">Resolved</span></div></div>
                <div class="stats-card warning"><i class="fas fa-exclamation-triangle"></i><div><span class="stats-value" id="dashPending">0</span><span class="stats-label" data-i18n="dash_pending">Pending</span></div></div>
            </div>
            <div class="charts-row">
                <div class="chart-box"><h3 data-i18n="dash_categories">Complaints by Category</h3><div id="categoryChart" class="category-bars"></div></div>
                <div class="chart-box"><h3 data-i18n="dash_risk">Risk Categories</h3><div class="risk-tags" id="riskTags"></div></div>
            </div>
        </div>
    </section>
    <footer><p data-i18n="footer_text">© 2026 <strong>CivicFit</strong></p></footer>

    <!-- JansevaAI Chatbot -->
    <div class="chatbot-container" id="chatbotContainer">
        <button class="chatbot-toggle" id="chatbotToggle"><i class="fas fa-comment-dots"></i> JansevaAI</button>
        <div class="chatbot-window" id="chatbotWindow" style="display:none;">
            <div class="chatbot-header"><span><i class="fas fa-robot"></i> JansevaAI</span><button class="chatbot-close" id="chatbotClose">&times;</button></div>
            <div class="chatbot-messages" id="chatbotMessages"></div>
            <div class="chatbot-input-area"><input type="text" id="chatbotInput" placeholder="Ask me anything..." /><button id="chatbotSend"><i class="fas fa-paper-plane"></i></button></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
