<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Complaint</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        video { width: 100%; border-radius: 16px; background: #000; margin-top: 8px; }
        .cam-btn { background: #2c3e66; }
        .map-location { height: 300px; margin-top: 10px; border-radius: 20px; z-index: 1; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Civic<span>Fit</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="complaint.html" class="active">File Complaint</a>
            <a href="track.html">Track</a>
        </div>
    </div>
    <div class="container">
        <div class="complaint-container">
            <h2><i class="fas fa-camera"></i> File a Complaint</h2>
            <form id="complaintForm">
                <div class="form-group">
                    <label>City</label>
                    <select id="city" required>
                        <option value="">Select</option>
                        <option>Nallasopara</option><option>Virar</option><option>Vasai</option>
                        <option>Mira Road</option><option>Bhayandar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="">Select</option>
                        <option>Road Damage</option><option>Water Supply</option><option>Drainage</option>
                        <option>Street Light</option><option>Garbage</option><option>Noise Pollution</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="3" required></textarea>
                </div>

                <!-- Live Camera -->
                <div class="form-group">
                    <label>Take a Photo</label>
                    <video id="video" autoplay playsinline muted></video>
                    <button type="button" id="startCam" class="cam-btn">Start Camera</button>
                    <button type="button" id="captureBtn" disabled>Capture Photo</button>
                    <div class="photo-preview" id="previewArea">
                        <img id="capturedImg">
                        <button type="button" id="removePhoto">Remove</button>
                    </div>
                    <input type="hidden" id="photoData">
                </div>

                <!-- Location (Map) -->
                <div class="form-group">
                    <label>Click on map to set location</label>
                    <div id="locationMap" class="map-location"></div>
                    <button type="button" id="useGps">Use My GPS</button>
                    <input type="hidden" id="lat">
                    <input type="hidden" id="lng">
                    <div id="locStatus" style="font-size:12px; margin-top:8px;">📍 No location set</div>
                </div>

                <button type="submit">Submit (gets 4-digit CID)</button>
            </form>
            <div id="successMsg" style="margin-top:15px; display:none; background:#d4edda; padding:12px; border-radius:12px;"></div>
        </div>
    </div>

    <script>
        // CAMERA
        let stream = null;
        const video = document.getElementById('video');
        const startCam = document.getElementById('startCam');
        const captureBtn = document.getElementById('captureBtn');
        const previewArea = document.getElementById('previewArea');
        const capturedImg = document.getElementById('capturedImg');
        const removePhoto = document.getElementById('removePhoto');
        const photoData = document.getElementById('photoData');

        startCam.onclick = async () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();
                captureBtn.disabled = false;
                startCam.disabled = true;
                startCam.textContent = 'Camera Ready';
            } catch(e) { alert('Camera denied'); }
        };
        captureBtn.onclick = () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const data = canvas.toDataURL('image/jpeg', 0.8);
            capturedImg.src = data;
            photoData.value = data;
            previewArea.style.display = 'block';
            captureBtn.textContent = 'Captured ✓';
            setTimeout(() => captureBtn.textContent = 'Capture Photo', 1500);
        };
        removePhoto.onclick = () => {
            photoData.value = '';
            previewArea.style.display = 'none';
        };

        // MAP & LOCATION
        let map, marker;
        function initMap(lat=19.076, lng=72.877) {
            if (map) map.remove();
            map = L.map('locationMap').setView([lat, lng], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            marker.on('dragend', () => {
                const pos = marker.getLatLng();
                document.getElementById('lat').value = pos.lat;
                document.getElementById('lng').value = pos.lng;
                document.getElementById('locStatus').innerHTML = `📍 Location: ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`;
            });
            map.on('click', e => {
                marker.setLatLng(e.latlng);
                document.getElementById('lat').value = e.latlng.lat;
                document.getElementById('lng').value = e.latlng.lng;
                document.getElementById('locStatus').innerHTML = `📍 Location: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
            });
        }
        initMap();
        document.getElementById('useGps').onclick = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 14);
                    marker.setLatLng([lat, lng]);
                    document.getElementById('lat').value = lat;
                    document.getElementById('lng').value = lng;
                    document.getElementById('locStatus').innerHTML = `📍 GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                }, err => alert('GPS failed'));
            } else alert('GPS not supported');
        };

        // SUBMIT
        const form = document.getElementById('complaintForm');
        const successDiv = document.getElementById('successMsg');
        form.onsubmit = (e) => {
            e.preventDefault();
            const city = document.getElementById('city').value;
            const category = document.getElementById('category').value;
            const desc = document.getElementById('description').value.trim();
            const photo = photoData.value;
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;

            if (!city || !category || !desc) return alert('Fill all fields');
            if (!photo) return alert('Capture a photo');
            if (!lat || !lng) return alert('Set location on map');

            const cid = Math.floor(1000 + Math.random() * 9000).toString();
            const complaint = {
                cid, city, category, description: desc, photo,
                lat: parseFloat(lat), lng: parseFloat(lng),
                status: 'Pending',
                timestamp: new Date().toISOString()
            };
            let all = JSON.parse(localStorage.getItem('civicfit') || '[]');
            all.unshift(complaint);
            localStorage.setItem('civicfit', JSON.stringify(all));
            successDiv.style.display = 'block';
            successDiv.innerHTML = `✅ Complaint submitted! Your CID: <strong>${cid}</strong><br>Use this on Track page.`;
            form.reset();
            removePhoto.click();
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            document.getElementById('locStatus').innerHTML = '📍 No location set';
            if (marker) marker.setLatLng([19.076, 72.877]);
            map.setView([19.076, 72.877], 12);
            setTimeout(() => successDiv.style.display = 'none', 5000);
        };
    </script>
</body>
</html>
