<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Complaint - CivicFit</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="logo"><div class="logo-icon"><i class="fas fa-city"></i><span class="logo-text">Civic<span class="logo-highlight">Fit</span></span></div></div>
            <div class="nav-links" id="navLinks">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="complaint.html" class="active"><i class="fas fa-pen-alt"></i> File Complaint</a>
                <a href="track.html"><i class="fas fa-search-location"></i> Track</a>
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            </div>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="complaint-page">
        <div class="complaint-container">
            <h2><i class="fas fa-pen-alt"></i> File a Complaint</h2>
            <p class="subtitle">Report an issue in any of our 5 cities</p>
            <form id="complaintForm">
                <div class="form-group">
                    <label>Select City <span style="color:#e63946;">*</span></label>
                    <select id="city" required>
                        <option value="">-- Choose City --</option>
                        <option value="Nallasopara">Nallasopara</option>
                        <option value="Virar">Virar</option>
                        <option value="Vasai">Vasai</option>
                        <option value="Mira Road">Mira Road</option>
                        <option value="Bhayandar">Bhayandar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Issue Category <span style="color:#e63946;">*</span></label>
                    <select id="category" required>
                        <option value="">-- Select Category --</option>
                        <option value="Road Damage">Road Damage / Potholes</option>
                        <option value="Water Supply">Water Supply</option>
                        <option value="Drainage">Drainage / Sewage</option>
                        <option value="Street Light">Street Light</option>
                        <option value="Garbage">Garbage Collection</option>
                        <option value="Noise Pollution">Noise Pollution</option>
                        <option value="Park Maintenance">Park Maintenance</option>
                        <option value="Electricity">Electricity</option>
                        <option value="Public Transport">Public Transport</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description <span style="color:#e63946;">*</span></label>
                    <textarea id="description" placeholder="Describe the issue in detail..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Proof Photo <span style="color:#e63946;">*</span></label>
                    <div class="photo-upload-area" id="photoUploadArea">
                        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
                        <div class="upload-placeholder" id="uploadPlaceholder">
                            <i class="fas fa-camera"></i>
                            <span>Click or tap to take a photo</span>
                        </div>
                        <img id="photoPreview" style="display:none; max-width:100%; max-height:200px; border-radius:12px;">
                        <button type="button" class="remove-photo-btn" id="removePhotoBtn" style="display:none;"><i class="fas fa-times"></i> Remove</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Submit Complaint</button>
            </form>
            <div class="success-msg" id="successMessage" style="display:none;"></div>
        </div>
    </section>
    <footer><p>&copy; 2026 <strong>CivicFit</strong></p></footer>

    <!-- JansevaAI Chatbot -->
    <div class="chatbot-container" id="chatbotContainer">
        <button class="chatbot-toggle" id="chatbotToggle"><i class="fas fa-comment-dots"></i> JansevaAI</button>
        <div class="chatbot-window" id="chatbotWindow" style="display:none;">
            <div class="chatbot-header">
                <span><i class="fas fa-robot"></i> JansevaAI</span>
                <button class="chatbot-close" id="chatbotClose">&times;</button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages"></div>
            <div class="chatbot-input-area">
                <input type="text" id="chatbotInput" placeholder="Ask me anything..." />
                <button id="chatbotSend"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
