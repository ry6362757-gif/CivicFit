<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CivicFit - File Complaint</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-city"></i> Civic<span>Fit</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="complaint.html" class="active">File Complaint</a>
                <a href="track.html">Track</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </nav>

    <section class="complaint-page">
        <div class="complaint-container">
            <h2><i class="fas fa-pen-alt"></i> File a Complaint</h2>
            <p class="subtitle">Live photo + map location → 4‑digit CID generated</p>
            <form id="complaintForm">
                <div class="form-group">
                    <label>Select City <span>*</span></label>
                    <select id="city" required>
                        <option value="">-- Choose City --</option>
                        <option>Nallasopara</option><option>Virar</option><option>Vasai</option>
                        <option>Mira Road</option><option>Bhayandar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Issue Category <span>*</span></label>
                    <select id="category" required>
                        <option value="">-- Select Category --</option>
                        <option>Road Damage</option><option>Water Supply</option><option>Drainage</option>
                        <option>Street Light</option><option>Garbage</option><option>Noise Pollution</option>
                        <option>Park Maintenance</option><option>Electricity</option><option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description <span>*</span></label>
                    <textarea id="description" placeholder="Describe the issue in detail..." required></textarea>
                </div>

                <!-- Live Camera -->
                <div class="form-group">
                    <label>Proof Photo (Live Camera) <span>*</span></label>
                    <div class="live-camera">
                        <video id="liveCamera" autoplay playsinline muted></video>
                    </div>
                    <div class="camera-controls">
                        <button type="button" class="cam-btn" id="startCameraBtn"><i class="fas fa-video"></i> Start Camera</button>
                        <button type="button" class="cam-btn capture-btn" id="capturePhotoBtn" disabled><i class="fas fa-camera"></i> Capture Photo</button>
                    </div>
                    <div class="photo-preview" id="photoPreviewArea">
                        <img id="capturedPhotoImg" src="">
                        <button type="button" class="remove-photo-btn" id="removeCapturedBtn"><i class="fas fa-trash-alt"></i> Remove & Retake</button>
                    </div>
                    <input type="hidden" id="photoData64" value="">
                </div>

                <!-- Location Picker -->
                <div class="form-group">
                    <label>Complaint Location (for heatmap) <span>*</span></label>
                    <div id="locationMap" class="map-location"></div>
                    <div class="location-buttons">
                        <button type="button" id="getGpsLocation" class="cam-btn"><i class="fas fa-location-dot"></i> Use My Location</button>
                    </div>
                    <input type="hidden" id="complaintLat" value="">
                    <input type="hidden" id="complaintLng" value="">
                    <div id="locationStatus" class="location-status">📍 Click on map or use GPS</div>
                </div>

                <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Submit Complaint (4-digit CID)</button>
            </form>
            <div class="success-msg" id="successMessage"></div>
        </div>
    </section>
    <footer><p>&copy; 2026 CivicFit</p></footer>
    <script src="script.js"></script>
</body>
</html>
