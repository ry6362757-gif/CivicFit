<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint - CivicFit</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="logo"><div class="logo-icon"><i class="fas fa-city"></i><span class="logo-text">Civic<span class="logo-highlight">Fit</span></span></div></div>
            <div class="nav-links" id="navLinks">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="complaint.html"><i class="fas fa-pen-alt"></i> File Complaint</a>
                <a href="track.html" class="active"><i class="fas fa-search-location"></i> Track</a>
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            </div>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="track-page">
        <div class="track-container">
            <h2><i class="fas fa-search-location"></i> Track Your Complaint</h2>
            <p class="subtitle">Enter your Complaint ID to see status & heatmap</p>
            <div class="track-input-group">
                <input type="text" id="trackIdInput" placeholder="e.g., CID-247952" />
                <button id="trackBtn"><i class="fas fa-arrow-right"></i> Track</button>
            </div>
            <div id="trackResult" style="display:none;">
                <div class="complaint-details" id="complaintDetails"></div>
                <div class="progress-steps" id="progressSteps"></div>
                <p class="track-note" id="trackNote"></p>
                <div id="mapContainer" style="height: 350px; margin-top: 20px; border-radius: 12px; overflow: hidden;"></div>
            </div>
            <div id="trackError" class="error-msg" style="display:none;"></div>
        </div>
    </section>
    <footer><p>&copy; 2026 <strong>CivicFit</strong></p></footer>

    <!-- Leaflet JS + Heatmap plugin -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="script.js"></script>
</body>
</html>
