<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicFit - Track Complaints</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-city"></i> Civic<span>Fit</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="complaint.html">File Complaint</a>
                <a href="track.html" class="active">Track</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="track-container">
        <div class="map-panel">
            <h2><i class="fas fa-fire"></i> Heatmap (intensity by status)</h2>
            <div id="heatmap"></div>
            <div id="debugInfo" class="debug-msg"></div>
            <p class="heatmap-legend">🔴 Pending (high) &nbsp; 🟠 In Progress (medium) &nbsp; 🟢 Resolved (low)</p>
        </div>
        <div class="list-panel">
            <h2><i class="fas fa-list"></i> All Complaints</h2>
            <div class="search-box">
                <input type="text" id="searchCID" placeholder="🔍 Search by 4-digit CID (e.g., 1234)">
                <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
                <button id="resetBtn"><i class="fas fa-sync-alt"></i> Reset</button>
            </div>
            <div id="complaintList"></div>
        </div>
    </div>
    <footer>Real‑time tracking – status changes update heatmap instantly</footer>

    <script>
        // ========== HELPERS ==========
        function loadComplaints() {
            const stored = localStorage.getItem('civicfit_complaints');
            return stored ? JSON.parse(stored) : [];
        }
        function saveComplaints(data) {
            localStorage.setItem('civicfit_complaints', JSON.stringify(data));
        }

        let map, heatLayer;
        let allComplaints = [];
        let currentFiltered = [];

        // ========== INIT MAP ==========
        function initMap() {
            if (map) return;
            map = L.map('heatmap').setView([19.0760, 72.8777], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        // ========== UPDATE HEATMAP ==========
        function updateHeatmap(complaintsArray) {
            initMap();
            const points = [];
            complaintsArray.forEach(c => {
                if (c.lat && c.lng && typeof c.lat === 'number' && typeof c.lng === 'number') {
                    let weight = 1.0;
                    if (c.status === 'In Progress') weight = 0.6;
                    if (c.status === 'Resolved') weight = 0.2;
                    points.push([c.lat, c.lng, weight]);
                }
            });
            if (heatLayer) map.removeLayer(heatLayer);
            const debugDiv = document.getElementById('debugInfo');
            if (points.length === 0) {
                debugDiv.innerHTML = '⚠️ No valid coordinates found. Please submit a complaint with a location (click on map in complaint form).';
                debugDiv.style.display = 'block';
                return;
            }
            debugDiv.style.display = 'none';
            heatLayer = L.heatLayer(points, { radius: 30, blur: 20, maxZoom: 15, minOpacity: 0.5 });
            heatLayer.addTo(map);
        }

        // ========== RENDER COMPLAINT LIST ==========
        function renderList(complaintsArray) {
            const container = document.getElementById('complaintList');
            if (!complaintsArray.length) {
                container.innerHTML = '<p>No complaints match your search.</p>';
                return;
            }
            let html = '';
            complaintsArray.forEach(c => {
                let statusColor = c.status === 'Pending' ? '#ff9800' : (c.status === 'In Progress' ? '#17a2b8' : '#28a745');
                html += `
                    <div class="complaint-card" data-cid="${c.cid}">
                        <strong><i class="fas fa-tag"></i> ${c.category}</strong><br>
                        <span class="cid">🆔 ${c.cid}</span><br>
                        <small>${c.description.substring(0, 80)}${c.description.length > 80 ? '...' : ''}</small><br>
                        <small>📍 ${c.lat?.toFixed(5) || '?'}, ${c.lng?.toFixed(5) || '?'}</small><br>
                        <small>🏙️ ${c.city} | 📅 ${new Date(c.timestamp).toLocaleString()}</small><br>
                        <select class="status-select" data-cid="${c.cid}" style="background:${statusColor}20">
                            <option ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option ${c.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                        </select>
                        <button class="delete-complaint" data-cid="${c.cid}"><i class="fas fa-trash"></i> Delete</button>
                        ${c.photo ? `<br><img src="${c.photo}" width="50" style="border-radius:8px; margin-top:5px;">` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;

            // Attach status change events
            document.querySelectorAll('.status-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const cid = select.getAttribute('data-cid');
                    const newStatus = select.value;
                    let all = loadComplaints();
                    const complaint = all.find(c => c.cid === cid);
                    if (complaint) {
                        complaint.status = newStatus;
                        saveComplaints(all);
                        window.dispatchEvent(new StorageEvent('storage', { key: 'civicfit_complaints', newValue: JSON.stringify(all) }));
                        refreshData(document.getElementById('searchCID').value);
                    }
                });
            });
            // Delete events
            document.querySelectorAll('.delete-complaint').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const cid = btn.getAttribute('data-cid');
                    let all = loadComplaints();
                    all = all.filter(c => c.cid !== cid);
                    saveComplaints(all);
                    window.dispatchEvent(new StorageEvent('storage', { key: 'civicfit_complaints', newValue: JSON.stringify(all) }));
                    refreshData(document.getElementById('searchCID').value);
                });
            });
        }

        // ========== REFRESH DATA (search + heatmap) ==========
        function refreshData(searchTerm = '') {
            allComplaints = loadComplaints();
            let filtered = [...allComplaints];
            if (searchTerm.trim() !== '') {
                filtered = filtered.filter(c => c.cid.includes(searchTerm.trim()));
            }
            currentFiltered = filtered;
            renderList(filtered);
            updateHeatmap(filtered);
        }

        // ========== EVENT LISTENERS ==========
        const searchInput = document.getElementById('searchCID');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');

        searchBtn.addEventListener('click', () => refreshData(searchInput.value));
        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            refreshData('');
        });
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') refreshData(searchInput.value);
        });

        // Initial load
        refreshData('');

        // Cross-tab updates
        window.addEventListener('storage', (e) => {
            if (e.key === 'civicfit_complaints') {
                refreshData(searchInput.value);
            }
        });
    </script>
</body>
</html>
