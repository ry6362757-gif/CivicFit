<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint - CivicFit</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="logo"><div class="logo-icon"><i class="fas fa-city"></i><span class="logo-text">Civic<span class="logo-highlight">Fit</span></span></div></div>
            <div class="nav-links" id="navLinks">
                <a href="index.html"><i class="fas fa-home"></i> <span data-i18n="nav_home">Home</span></a>
                <a href="complaint.html"><i class="fas fa-pen-alt"></i> <span data-i18n="nav_complaint">File Complaint</span></a>
                <a href="track.html" class="active"><i class="fas fa-search-location"></i> <span data-i18n="nav_track">Track</span></a>
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
            </div>
            <div class="lang-switcher">
                <select id="languageSelect">
                    <option value="en">🇬🇧 English</option>
                    <option value="hi">🇮🇳 हिन्दी</option>
                    <option value="mr">🇮🇳 मराठी</option>
                </select>
            </div>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="track-page">
        <div class="track-container">
            <h2><i class="fas fa-search-location"></i> <span data-i18n="track_title">Track Your Complaint</span></h2>
            <p class="subtitle" data-i18n="track_subtitle">Enter your Complaint ID to see status, photo & live heatmap</p>
            <div class="track-input-group">
                <input type="text" id="trackIdInput" placeholder="e.g., CID-247952" />
                <button id="trackBtn"><i class="fas fa-arrow-right"></i> <span data-i18n="track_btn">Track</span></button>
            </div>
            <div id="trackResult" style="display:none;">
                <div class="complaint-details" id="complaintDetails"></div>
                <div id="complaintPhoto" style="margin-bottom:20px;"></div>
                <div class="progress-steps" id="progressSteps"></div>
                <p class="track-note" id="trackNote"></p>
                <div id="mapContainer" style="height: 350px; margin-top: 20px; border-radius: 12px; overflow: hidden;"></div>
                <div class="live-badge"><span class="pulse"></span> <span data-i18n="live_update">Live updating every 10 seconds</span></div>
            </div>
            <div id="trackError" class="error-msg" style="display:none;"></div>
        </div>
    </section>
    <footer><p data-i18n="footer_text">© 2026 <strong>CivicFit</strong></p></footer>

    <!-- JansevaAI Chatbot -->
    <div class="chatbot-container" id="chatbotContainer">
        <button class="chatbot-toggle" id="chatbotToggle"><i class="fas fa-comment-dots"></i> JansevaAI</button>
        <div class="chatbot-window" id="chatbotWindow" style="display:none;">
            <div class="chatbot-header"><span><i class="fas fa-robot"></i> JansevaAI</span><button class="chatbot-close" id="chatbotClose">&times;</button></div>
            <div class="chatbot-messages" id="chatbotMessages"></div>
            <div class="chatbot-input-area"><input type="text" id="chatbotInput" placeholder="Ask me anything..." /><button id="chatbotSend"><i class="fas fa-paper-plane"></i></button></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="script.js"></script>
</body>
</html>
