<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicFit - Track Complaints</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-city"></i> Civic<span>Fit</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="complaint.html">File Complaint</a>
                <a href="track.html" class="active">Track</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="track-container">
        <div class="map-panel">
            <h2><i class="fas fa-fire"></i> Heatmap (Intensity by status)</h2>
            <div id="heatmap"></div>
            <p class="heatmap-legend">🔴 Pending (high) &nbsp; 🟠 In Progress (medium) &nbsp; 🟢 Resolved (low)</p>
        </div>
        <div class="list-panel">
            <h2><i class="fas fa-list"></i> All Complaints</h2>
            <div class="search-box">
                <input type="text" id="searchCID" placeholder="🔍 Search by 4-digit CID (e.g., 1234)">
                <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
                <button id="resetSearch"><i class="fas fa-sync-alt"></i> Reset</button>
            </div>
            <div id="complaintList"></div>
        </div>
    </div>
    <footer><p>Real‑time tracking – change status to update heatmap instantly</p></footer>
    <script src="script.js"></script>
</body>
</html>
